<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabel Ombori — Demontaj nazorati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #EEF1F6; --bg-2: #F7EFEA; --bg-3: #EAF3F1;
    --ink: #1C1C1E; --muted: #6E6E73;
    --glass: rgba(255,255,255,0.62); --glass-strong: rgba(255,255,255,0.78);
    --glass-border: rgba(255,255,255,0.55); --hairline: rgba(60,60,67,0.14);
    --accent: #0A84FF; --accent-ink: #FFFFFF;
    --ok: #34C759; --warn: #FF9F0A; --danger: #FF3B30;
    --bar-track: rgba(60,60,67,0.12); --focus: #0A84FF;
    --shadow: 0 8px 30px rgba(31,38,55,0.08), 0 1px 2px rgba(31,38,55,0.04);
    --shadow-lg: 0 20px 60px rgba(31,38,55,0.14), 0 2px 8px rgba(31,38,55,0.06);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg-1: #08090C; --bg-2: #0E0B12; --bg-3: #060C10;
      --ink: #F2F2F7; --muted: #98989D;
      --glass: rgba(40,40,46,0.58); --glass-strong: rgba(48,48,54,0.72);
      --glass-border: rgba(255,255,255,0.10); --hairline: rgba(255,255,255,0.12);
      --accent: #409CFF; --accent-ink: #06121F;
      --ok: #32D74B; --warn: #FFB340; --danger: #FF6961;
      --bar-track: rgba(255,255,255,0.12); --focus: #409CFF;
      --shadow: 0 8px 30px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3);
      --shadow-lg: 0 24px 70px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg-1: #08090C; --bg-2: #0E0B12; --bg-3: #060C10;
    --ink: #F2F2F7; --muted: #98989D;
    --glass: rgba(40,40,46,0.58); --glass-strong: rgba(48,48,54,0.72);
    --glass-border: rgba(255,255,255,0.10); --hairline: rgba(255,255,255,0.12);
    --accent: #409CFF; --accent-ink: #06121F;
    --ok: #32D74B; --warn: #FFB340; --danger: #FF6961;
    --bar-track: rgba(255,255,255,0.12); --focus: #409CFF;
    --shadow: 0 8px 30px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3);
    --shadow-lg: 0 24px 70px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    font-size: 15px; line-height: 1.5; min-height: 100vh;
    background:
      radial-gradient(1100px 700px at -10% -15%, var(--bg-2) 0%, transparent 60%),
      radial-gradient(1000px 800px at 110% 10%, var(--bg-3) 0%, transparent 55%),
      var(--bg-1);
    background-attachment: fixed;
  }
  .mono { font-family: ui-monospace, 'SF Mono', 'IBM Plex Mono', Menlo, Consolas, monospace; }
  a { color: inherit; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

  .shell { display: flex; min-height: 100vh; align-items: stretch; }

  .sidebar {
    width: 240px; flex-shrink: 0;
    background: var(--glass);
    -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    padding: 22px 14px;
    display: flex; flex-direction: column;
    position: sticky; top: 16px;
    height: calc(100vh - 32px);
    margin: 16px 0 16px 16px;
    box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px 10px; margin-bottom: 10px; border-bottom: 1px solid var(--hairline); }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(155deg, #5AC8FA, var(--accent));
    box-shadow: 0 2px 8px rgba(10,132,255,0.35), inset 0 1px 1px rgba(255,255,255,0.5);
  }
  .brand-text { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11px; color: var(--muted); display: block; margin-top: 1px; }
  nav.navlist { display: flex; flex-direction: column; gap: 3px; }
  .navlink {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px;
    text-decoration: none; color: var(--muted); font-weight: 590; cursor: pointer; border: none;
    background: transparent; text-align: left; width: 100%; font-size: 14px;
    transition: background .15s ease, color .15s ease;
  }
  .navlink:hover { background: rgba(120,120,128,0.12); color: var(--ink); }
  .navlink.active { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 10px rgba(10,132,255,0.35); }
  .navlink.active .dot { background: var(--accent-ink); }
  .navlink .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; opacity: .6; }
  .sidebar-foot { margin-top: auto; padding: 12px 12px 2px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--hairline); }
  .topbar { display: none; }

  main { flex: 1; min-width: 0; padding: 0; }
  .page-container { max-width: 1000px; margin: 0 auto; padding: 36px 40px 72px; }
  @media (min-width: 1400px) { .page-container { max-width: 1080px; } }

  .icon-btn { padding: 9px; font-size: 15px; line-height: 1; width: 40px; height: 40px; min-width: 40px; justify-content: center; border-radius: 50%; transition: transform .12s ease, background .15s ease, color .15s ease; }
  .icon-btn svg { display: block; width: 17px; height: 17px; }

  .page-head { margin-bottom: 26px; }
  .page-head h1 { font-size: 26px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.02em; }
  .page-head p { margin: 0; color: var(--muted); font-size: 14.5px; max-width: 62ch; }

  .summary-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 30px; }
  .summary-cell {
    background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow);
  }
  .summary-cell .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .summary-cell .value { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .summary-cell .value small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 3px; }

  section.block { margin-bottom: 32px; }
  .block-title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; gap: 12px; flex-wrap: wrap; padding: 0 4px; }
  .block-title h2 { font-size: 15px; font-weight: 650; margin: 0; }
  .block-title .hint { font-size: 12px; color: var(--muted); }

  table.ledger {
    width: 100%; border-collapse: collapse; font-size: 13.5px;
    background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow);
  }
  table.ledger th { text-align: left; font-weight: 590; color: var(--muted); font-size: 11.5px; text-transform: none; padding: 10px 14px; border-bottom: 1px solid var(--hairline); }
  table.ledger td { padding: 11px 14px; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
  table.ledger tbody tr:last-child td { border-bottom: none; }
  table.ledger tbody tr:hover { background: rgba(120,120,128,0.08); }
  .num { font-family: ui-monospace, 'SF Mono', 'IBM Plex Mono', Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .qty-cell { display: inline-flex; align-items: baseline; justify-content: flex-end; gap: 4px; width: 100%; }
  .qty-cell .qty-unit { color: var(--muted); font-size: 0.82em; min-width: 30px; text-align: left; }
  .right { text-align: right; }
  .muted-text { color: var(--muted); }
  .sub { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .progress-cell { display: flex; align-items: center; gap: 8px; min-width: 160px; }
  .bar-track { flex: 1; height: 6px; background: var(--bar-track); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--ok); }
  .bar-fill.over { background: var(--warn); }
  .bar-fill.zero { background: var(--bar-track); }
  .pct { font-family: ui-monospace, 'SF Mono', monospace; font-size: 12px; color: var(--muted); width: 34px; text-align: right; flex-shrink: 0; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 650; }
  .badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .badge.muted { background: rgba(120,120,128,0.16); color: var(--muted); }

  .empty {
    border: 1px dashed var(--hairline); background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-radius: 18px; padding: 30px 20px; text-align: center; color: var(--muted); font-size: 13.5px;
  }
  .empty a.linklike, button.linklike { background: none; border: none; color: var(--accent); font-weight: 650; cursor: pointer; text-decoration: none; padding: 0; font-size: inherit; }
  .empty a.linklike:hover, button.linklike:hover { text-decoration: underline; }

  .card {
    background: var(--glass-strong); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border); border-radius: 20px; padding: 22px; margin-bottom: 22px; box-shadow: var(--shadow);
  }
  .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; color: var(--muted); font-weight: 590; }
  .field input, .field select {
    padding: 10px 12px; border: 1px solid var(--hairline); border-radius: 12px;
    background: rgba(120,120,128,0.08); color: var(--ink);
  }
  .field input:focus, .field select:focus { background: var(--glass-strong); }

  .material-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .material-row {
    display: grid; grid-template-columns: 20px 1fr 110px 32px; gap: 8px; align-items: center;
    padding: 6px; border-radius: 12px; transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s ease, background .16s ease;
    position: relative;
  }
  .material-row:hover {
    transform: scale(1.035) translateY(-1px);
    background: var(--glass-strong);
    box-shadow: var(--shadow-lg);
    z-index: 2;
  }
  .row-num { font-size: 12px; color: var(--muted); text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .material-row input, .material-row select { padding: 9px 11px; border: 1px solid var(--hairline); border-radius: 12px; background: rgba(120,120,128,0.08); color: var(--ink); }
  .row-hint { font-size: 11px; color: var(--muted); grid-column: 1 / -1; margin-top: -4px; }
  .row-remove {
    border: none; background: rgba(120,120,128,0.14); color: var(--muted); border-radius: 50%;
    width: 32px; height: 32px; cursor: pointer; font-size: 15px; line-height: 1;
  }
  .row-remove:hover { color: #fff; background: var(--danger); }
  .row-remove:disabled { opacity: .4; cursor: default; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 999px;
    border: 1px solid var(--hairline); background: rgba(120,120,128,0.10); cursor: pointer;
    font-weight: 600; font-size: 13.5px; color: var(--ink); transition: background .15s ease, transform .05s ease;
  }
  .btn:hover { background: rgba(120,120,128,0.18); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 4px 14px rgba(10,132,255,0.35); }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); box-shadow: none; }
  .btn.ghost:hover { color: var(--ink); background: rgba(120,120,128,0.14); }
  .btn.small { padding: 6px 12px; font-size: 12.5px; }
  .btn.danger-outline { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); background: color-mix(in srgb, var(--danger) 8%, transparent); }
  .btn.block-btn { width: 100%; justify-content: center; padding: 13px; margin-bottom: 14px; border-radius: 16px; }
  .btn.block-btn:not(.primary) { border-style: dashed; background: rgba(120,120,128,0.06); }

  .form-actions { display: flex; gap: 10px; margin-top: 4px; align-items: center; }
  .form-error { color: var(--danger); font-size: 13px; margin: 0 0 12px; padding: 10px 14px; background: color-mix(in srgb, var(--danger) 12%, transparent); border-radius: 12px; display: none; }
  .form-error.show { display: block; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters select, .filters input {
    padding: 8px 12px; border: 1px solid var(--hairline); border-radius: 999px;
    background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    color: var(--ink); font-size: 13px;
  }

  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(6px);
    background: var(--glass-strong); color: var(--ink);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    padding: 12px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 500;
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
    z-index: 50; max-width: 90vw; text-align: center; box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .backup-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .danger-zone {
    border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    background: color-mix(in srgb, var(--danger) 6%, transparent);
    border-radius: 20px; padding: 20px 22px; margin-top: 26px;
  }
  .danger-zone h3 { margin: 0 0 6px; font-size: 14px; color: var(--danger); }
  .danger-zone p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }

  details.detail-toggle summary { cursor: pointer; color: var(--accent); font-size: 12.5px; font-weight: 650; list-style: none; }
  details.detail-toggle summary::-webkit-details-marker { display: none; }
  details.detail-toggle summary:before { content: "▸ "; }
  details.detail-toggle[open] summary:before { content: "▾ "; }
  details.detail-toggle .sub-table { margin-top: 10px; }
  details.detail-toggle h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; font-weight: 650; }
  details.detail-toggle h4:first-of-type { margin-top: 8px; }
  table.ledger.mini { box-shadow: none; border-radius: 12px; }
  table.ledger.mini th, table.ledger.mini td { padding: 5px 10px; border-bottom: none; font-size: 12.5px; }
  table.ledger td, table.ledger th { cursor: default; }

  details.trash-panel { margin-top: 14px; padding: 2px 4px; }
  details.trash-panel summary { cursor: pointer; font-size: 12.5px; font-weight: 650; color: var(--muted); list-style: none; }
  details.trash-panel summary::-webkit-details-marker { display: none; }

  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .icon-btn:hover { transform: scale(1.15); }
  .icon-btn:active { transform: scale(1.02); }
  .btn.danger-icon { color: var(--danger); }
  .btn.danger-icon:hover { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }

  @media (max-width: 820px) {
    .shell { flex-direction: column; }
    .sidebar { display: none; }
    .topbar {
      display: flex; gap: 4px; overflow-x: auto; padding: 10px 12px; margin: 10px 10px 0;
      background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border); border-radius: 18px; position: sticky; top: 10px; z-index: 20; box-shadow: var(--shadow);
    }
    .topbar button { flex-shrink: 0; padding: 8px 14px; border-radius: 999px; border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .topbar button.active { background: var(--accent); color: var(--accent-ink); }
    .page-container { padding: 20px 16px 48px; }
    .summary-strip { grid-template-columns: repeat(2, 1fr); }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span><span class="brand-text">Kabel Ombori</span><span class="brand-sub">Demontaj material nazorati</span></span>
    </div>
    <nav class="navlist" id="sidebarNav">
      <button class="navlink" data-view="dashboard"><span class="dot"></span>Bosh sahifa</button>
      <button class="navlink" data-view="orders"><span class="dot"></span>Farmoyishlar</button>
      <button class="navlink" data-view="receipts"><span class="dot"></span>Kirimlar</button>
      <button class="navlink" data-view="materials"><span class="dot"></span>Materiallar</button>
      <button class="navlink" data-view="backup"><span class="dot"></span>Zaxira nusxa</button>
    </nav>
    <div class="sidebar-foot" id="storageStatus">Saqlash rejimi aniqlanmoqda...</div>
  </aside>
  <div class="topbar" id="topbarNav">
    <button data-view="dashboard">Bosh sahifa</button>
    <button data-view="orders">Farmoyishlar</button>
    <button data-view="receipts">Kirimlar</button>
    <button data-view="materials">Materiallar</button>
    <button data-view="backup">Zaxira nusxa</button>
  </div>
  <main id="mainContent"></main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  "use strict";

  var ORDERS_KEY = "kabelOmbor.farmoyishlar.v2";
  var RECEIPTS_KEY = "kabelOmbor.kirimlar.v2";
  var MATERIALS_KEY = "kabelOmbor.materialTurlari.v1";

  function loadLocal(key) { try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : []; } catch (e) { return []; } }
  function saveLocal(key, list) { try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) { showToast("Saqlashda xatolik yuz berdi."); } }

  var storageMode = "connecting"; // "connecting" | "shared" | "local"
  var dbHandle = null;
  var assetsHandle = null;
  var unsubs = [];

  var state = {
    orders: [], receipts: [], materialTypes: [],
    view: "dashboard",
    showOrderForm: false,
    editingOrderId: null,
    orderFormMeta: { raqam: "", sana: "", izoh: "" },
    orderFormRows: [{ nomi: "", miqdor: "" }],
    showTrash: false,
    orderSearch: "",
    showReceiptForm: false,
    editingReceiptId: null,
    receiptFormMeta: { farmoyishId: "", sana: "", hujjat: "" },
    receiptFormRows: [{ materialNomi: "", miqdor: "" }],
    receiptFilter: { orderId: "", from: "", to: "" }
  };

  function iconPencil() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'; }
  function iconTrash() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>'; }
  function iconRestore() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>'; }
  function iconPurge() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>'; }
  function iconPlus() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>'; }
  function iconPdf() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'; }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  var UNITS = { m: "metr", dona: "dona", kg: "kg" };
  function unitLabel(u) { return UNITS[u] || "m"; }
  function unitOptionsHtml(selected) {
    return Object.keys(UNITS).map(function (u) { return '<option value="' + u + '"' + (u === selected ? " selected" : "") + '>' + UNITS[u] + '</option>'; }).join("");
  }
  function fmtQty(n, unit) { return fmtNum(n) + " " + unitLabel(unit); }
  function fmtQtyCell(n, unit) { return '<span class="qty-cell"><span>' + fmtNum(n) + '</span><span class="qty-unit">' + unitLabel(unit) + '</span></span>'; }
  function esc(str) { return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmtNum(n) { n = Number(n) || 0; return n.toLocaleString("uz-UZ", { maximumFractionDigits: 1 }); }
  function fmtDate(iso) {
    if (!iso) return "—";
    var p = iso.split("-");
    return p.length === 3 ? p[2] + "." + p[1] + "." + p[0] : iso;
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2800);
  }

  // ---------- doc <-> object mapping ----------
  function docToOrder(doc) {
    var d = doc.data() || {};
    return { id: doc.id, raqam: d.raqam || "", sana: d.sana || "", izoh: d.izoh || "", deleted: !!d.deleted, hujjatFayl: d.hujjatFayl || null, materiallar: Array.isArray(d.materiallar) ? d.materiallar : [] };
  }
  function docToReceipt(doc) {
    var d = doc.data() || {};
    return { id: doc.id, farmoyishId: d.farmoyishId || "", sana: d.sana || "", hujjat: d.hujjat || "", deleted: !!d.deleted, materiallar: Array.isArray(d.materiallar) ? d.materiallar : [] };
  }
  function docToMaterialType(doc) {
    var d = doc.data() || {};
    return { id: doc.id, nomi: d.nomi || "", birlik: d.birlik || "m" };
  }

  // ---------- Storage bootstrap ----------
  function initStorage() {
    if (!window.claude || typeof window.claude.use !== "function") { fallbackToLocal(); return; }
    window.claude.use("assets").then(function (a) { assetsHandle = a; }).catch(function () { assetsHandle = null; });
    window.claude.use("db").then(function (db) {
      if (!db) { fallbackToLocal(); return; }
      dbHandle = db; storageMode = "shared";
      try {
        unsubs.push(db.collection("farmoyishlar").onSnapshot(function (snap) { state.orders = snap.docs.map(docToOrder); render(); }, function () { fallbackToLocal(); }));
        unsubs.push(db.collection("kirimlar").onSnapshot(function (snap) { state.receipts = snap.docs.map(docToReceipt); render(); }, function () { fallbackToLocal(); }));
        unsubs.push(db.collection("materialTurlari").onSnapshot(function (snap) { state.materialTypes = snap.docs.map(docToMaterialType); render(); }, function () { fallbackToLocal(); }));
      } catch (e) { fallbackToLocal(); }
      render();
    }).catch(function () { fallbackToLocal(); });
  }
  function fallbackToLocal() {
    if (storageMode === "local") return;
    storageMode = "local";
    unsubs.forEach(function (u) { try { u(); } catch (e) {} });
    unsubs = [];
    state.orders = loadLocal(ORDERS_KEY);
    state.receipts = loadLocal(RECEIPTS_KEY);
    state.materialTypes = loadLocal(MATERIALS_KEY);
    render();
  }

  // ---------- Unified record operations (all return Promises) ----------
  function addOrderRecord(data) {
    if (storageMode === "shared" && dbHandle) return dbHandle.collection("farmoyishlar").add(data);
    state.orders.push(Object.assign({ id: uid() }, data));
    saveLocal(ORDERS_KEY, state.orders);
    return Promise.resolve();
  }
  function updateOrderRecord(id, data) {
    if (storageMode === "shared" && dbHandle) return dbHandle.doc("farmoyishlar/" + id).update(data);
    var idx = state.orders.findIndex(function (o) { return o.id === id; });
    if (idx > -1) state.orders[idx] = Object.assign({}, state.orders[idx], data);
    saveLocal(ORDERS_KEY, state.orders);
    return Promise.resolve();
  }
  function hardDeleteOrderCascade(id) {
    var order = getOrderById(id);
    var relatedIds = state.receipts.filter(function (r) { return r.farmoyishId === id; }).map(function (r) { return r.id; });
    if (order && order.hujjatFayl && assetsHandle) { assetsHandle.delete(order.hujjatFayl).catch(function () {}); }
    if (storageMode === "shared" && dbHandle) {
      return Promise.all([dbHandle.doc("farmoyishlar/" + id).delete()].concat(relatedIds.map(function (rid) { return dbHandle.doc("kirimlar/" + rid).delete(); })));
    }
    state.orders = state.orders.filter(function (o) { return o.id !== id; });
    state.receipts = state.receipts.filter(function (r) { return r.farmoyishId !== id; });
    saveLocal(ORDERS_KEY, state.orders); saveLocal(RECEIPTS_KEY, state.receipts);
    return Promise.resolve();
  }
  function addReceiptRecord(data) {
    if (storageMode === "shared" && dbHandle) return dbHandle.collection("kirimlar").add(data);
    state.receipts.push(Object.assign({ id: uid() }, data));
    saveLocal(RECEIPTS_KEY, state.receipts);
    return Promise.resolve();
  }
  function updateReceiptRecord(id, data) {
    if (storageMode === "shared" && dbHandle) return dbHandle.doc("kirimlar/" + id).update(data);
    var idx = state.receipts.findIndex(function (r) { return r.id === id; });
    if (idx > -1) state.receipts[idx] = Object.assign({}, state.receipts[idx], data);
    saveLocal(RECEIPTS_KEY, state.receipts);
    return Promise.resolve();
  }
  function hardDeleteReceipt(id) {
    if (storageMode === "shared" && dbHandle) return dbHandle.doc("kirimlar/" + id).delete();
    state.receipts = state.receipts.filter(function (r) { return r.id !== id; });
    saveLocal(RECEIPTS_KEY, state.receipts);
    return Promise.resolve();
  }
  function addMaterialTypeRecord(data) {
    if (storageMode === "shared" && dbHandle) return dbHandle.collection("materialTurlari").add(data);
    state.materialTypes.push(Object.assign({ id: uid() }, data));
    saveLocal(MATERIALS_KEY, state.materialTypes);
    return Promise.resolve();
  }
  function deleteMaterialTypeRecord(id) {
    if (storageMode === "shared" && dbHandle) return dbHandle.doc("materialTurlari/" + id).delete();
    state.materialTypes = state.materialTypes.filter(function (m) { return m.id !== id; });
    saveLocal(MATERIALS_KEY, state.materialTypes);
    return Promise.resolve();
  }
  function wipeAllRecords() {
    if (storageMode === "shared" && dbHandle) {
      if (assetsHandle) {
        state.orders.forEach(function (o) { if (o.hujjatFayl) assetsHandle.delete(o.hujjatFayl).catch(function () {}); });
      }
      var all = state.orders.map(function (o) { return dbHandle.doc("farmoyishlar/" + o.id).delete().catch(function () {}); })
        .concat(state.receipts.map(function (r) { return dbHandle.doc("kirimlar/" + r.id).delete().catch(function () {}); }))
        .concat(state.materialTypes.map(function (m) { return dbHandle.doc("materialTurlari/" + m.id).delete().catch(function () {}); }));
      Promise.all(all).then(function () { showToast("Barcha ma'lumot o'chirildi."); setView("dashboard"); });
    } else {
      state.orders = []; state.receipts = []; state.materialTypes = [];
      saveLocal(ORDERS_KEY, []); saveLocal(RECEIPTS_KEY, []); saveLocal(MATERIALS_KEY, []);
      showToast("Barcha ma'lumot o'chirildi.");
      setView("dashboard");
    }
  }
  function importRecords(data) {
    var materialTurlari = Array.isArray(data.materialTurlari) ? data.materialTurlari : [];
    if (storageMode === "shared" && dbHandle) {
      var wipeAll = function () {
        return Promise.all(
          state.orders.map(function (o) { return dbHandle.doc("farmoyishlar/" + o.id).delete().catch(function () {}); })
          .concat(state.receipts.map(function (r) { return dbHandle.doc("kirimlar/" + r.id).delete().catch(function () {}); }))
          .concat(state.materialTypes.map(function (m) { return dbHandle.doc("materialTurlari/" + m.id).delete().catch(function () {}); }))
        );
      };
      wipeAll().then(function () {
        return Promise.all(
          data.farmoyishlar.map(function (o) { return dbHandle.collection("farmoyishlar").add({ raqam: o.raqam, sana: o.sana, izoh: o.izoh || "", deleted: !!o.deleted, hujjatFayl: o.hujjatFayl || null, materiallar: o.materiallar || [] }); })
          .concat(data.kirimlar.map(function (r) { return dbHandle.collection("kirimlar").add({ farmoyishId: r.farmoyishId, sana: r.sana, hujjat: r.hujjat || "", deleted: !!r.deleted, materiallar: r.materiallar || [] }); }))
          .concat(materialTurlari.map(function (m) { return dbHandle.collection("materialTurlari").add({ nomi: m.nomi, birlik: m.birlik || "m" }); }))
        );
      }).then(function () { showToast("Ma'lumotlar muvaffaqiyatli tiklandi."); setView("dashboard"); })
        .catch(function () { showToast("Tiklashda xatolik yuz berdi."); });
    } else {
      state.orders = data.farmoyishlar;
      state.receipts = data.kirimlar;
      state.materialTypes = materialTurlari;
      saveLocal(ORDERS_KEY, state.orders); saveLocal(RECEIPTS_KEY, state.receipts); saveLocal(MATERIALS_KEY, state.materialTypes);
      showToast("Ma'lumotlar muvaffaqiyatli tiklandi.");
      setView("dashboard");
    }
  }

  // ---------- Derived data ----------
  function activeOrders() { return state.orders.filter(function (o) { return !o.deleted; }); }
  function trashedOrders() { return state.orders.filter(function (o) { return o.deleted; }); }
  function activeReceipts() { return state.receipts.filter(function (r) { return !r.deleted; }); }
  function trashedReceipts() { return state.receipts.filter(function (r) { return r.deleted; }); }
  function getOrderById(id) { return state.orders.find(function (o) { return o.id === id; }); }
  function getMaterialTypeByName(nomi) { return state.materialTypes.find(function (m) { return m.nomi === nomi; }); }

  // Per-material plan/received for one order. excludeReceiptId lets an edit-in-progress
  // ignore its own prior contribution when computing what's still available.
  function orderMaterialProgress(order, excludeReceiptId) {
    var receiptsForOrder = state.receipts.filter(function (r) { return r.farmoyishId === order.id && !r.deleted && r.id !== excludeReceiptId; });
    return (order.materiallar || []).map(function (m) {
      var kirim = receiptsForOrder.reduce(function (s, r) {
        return s + (r.materiallar || []).filter(function (x) { return x.nomi === m.nomi; }).reduce(function (s2, x) { return s2 + (Number(x.miqdor) || 0); }, 0);
      }, 0);
      return { nomi: m.nomi, birlik: m.birlik || "m", reja: Number(m.miqdor) || 0, kirim: kirim, qoldiq: Math.max(0, (Number(m.miqdor) || 0) - kirim) };
    });
  }
  function orderReceiptsForOrder(order) {
    return activeReceipts().filter(function (r) { return r.farmoyishId === order.id; }).sort(function (a, b) { return b.sana.localeCompare(a.sana); });
  }
  function receiptMaterialsLabel(receipt) {
    return (receipt.materiallar || []).map(function (m) { return esc(m.nomi) + ": " + fmtQty(m.miqdor, m.birlik); }).join(", ") || "—";
  }
  function receiptMaterialsDetail(receipt) {
    var mats = receipt.materiallar || [];
    if (!mats.length) return "—";
    var rows = mats.map(function (m) { return '<tr><td>' + esc(m.nomi) + '</td><td class="num right">' + fmtQtyCell(m.miqdor, m.birlik) + '</td></tr>'; }).join("");
    return '<details class="detail-toggle"><summary>' + mats.length + ' ta material</summary>' +
      '<table class="ledger mini" style="margin-top:6px;"><tbody>' + rows + '</tbody></table></details>';
  }
  function orderAvgPct(order) {
    var rows = orderMaterialProgress(order);
    if (!rows.length) return 0;
    var sum = rows.reduce(function (s, r) { return s + (r.reja > 0 ? Math.min(100, (r.kirim / r.reja) * 100) : 0); }, 0);
    return Math.round(sum / rows.length);
  }
  function orderStatus(order) {
    var rows = orderMaterialProgress(order);
    if (!rows.length) return { label: "Reja yo'q", cls: "muted" };
    var anyReceived = rows.some(function (r) { return r.kirim > 0; });
    var allDone = rows.every(function (r) { return r.reja > 0 && r.kirim >= r.reja; });
    if (allDone) return { label: "Bajarildi", cls: "ok" };
    if (!anyReceived) return { label: "Boshlanmagan", cls: "muted" };
    return { label: "Jarayonda", cls: "warn" };
  }
  function materialSummary() {
    var map = {};
    activeOrders().forEach(function (o) {
      (o.materiallar || []).forEach(function (m) {
        if (!m.nomi) return;
        if (!map[m.nomi]) map[m.nomi] = { nomi: m.nomi, birlik: m.birlik || "m", reja: 0, kirim: 0 };
        map[m.nomi].reja += Number(m.miqdor) || 0;
      });
    });
    activeReceipts().forEach(function (r) {
      var order = getOrderById(r.farmoyishId);
      if (order && order.deleted) return;
      (r.materiallar || []).forEach(function (m) {
        if (!m.nomi) return;
        if (!map[m.nomi]) map[m.nomi] = { nomi: m.nomi, birlik: m.birlik || "m", reja: 0, kirim: 0 };
        map[m.nomi].kirim += Number(m.miqdor) || 0;
      });
    });
    return Object.values(map).sort(function (a, b) { return a.nomi.localeCompare(b.nomi); });
  }

  // ---------- Router / render ----------
  function setView(v) { state.view = v; render(); window.scrollTo(0, 0); }

  function render() {
    document.querySelectorAll("#sidebarNav .navlink").forEach(function (btn) { btn.classList.toggle("active", btn.dataset.view === state.view); });
    document.querySelectorAll("#topbarNav button").forEach(function (btn) { btn.classList.toggle("active", btn.dataset.view === state.view); });
    var statusEl = document.getElementById("storageStatus");
    if (statusEl) {
      if (storageMode === "shared") statusEl.innerHTML = '🟢 <strong>Jamoaviy saqlash</strong><br>Ma\'lumot serverda, real vaqtda ulashiladi.';
      else if (storageMode === "local") statusEl.innerHTML = '🟡 <strong>Faqat shu brauzerda</strong><br>"Zaxira nusxa" bo\'limidan muntazam yuklab oling.';
      else statusEl.innerHTML = 'Saqlash rejimi aniqlanmoqda...';
    }
    var main = document.getElementById("mainContent");
    var body = "";
    if (state.view === "dashboard") body = renderDashboard();
    else if (state.view === "orders") body = renderOrders();
    else if (state.view === "materials") body = renderMaterials();
    else if (state.view === "receipts") body = renderReceipts();
    else if (state.view === "backup") body = renderBackup();
    main.innerHTML = '<div class="page-container">' + body + '</div>';
    bindViewEvents();
  }

  function summaryCell(label, value, unit) { return '<div class="summary-cell"><div class="label">' + esc(label) + '</div><div class="value">' + value + '<small>' + esc(unit) + '</small></div></div>'; }
  function progressCell(received, planned) {
    var pct = planned > 0 ? Math.round((received / planned) * 100) : 0;
    var fillPct = Math.min(100, pct);
    var cls = pct === 0 ? "zero" : (received > planned ? "over" : "");
    return '<div class="progress-cell"><div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + fillPct + '%"></div></div><span class="pct">' + pct + '%</span></div>';
  }
  function pageHead(title, sub) { return '<div class="page-head"><h1>' + esc(title) + '</h1><p>' + esc(sub) + '</p></div>'; }
  function block(title, hint, body) { return '<section class="block"><div class="block-title"><h2>' + esc(title) + '</h2><span class="hint">' + esc(hint) + '</span></div>' + body + '</section>'; }
  function emptyState(msg, linkLabel, view) { return '<div class="empty">' + esc(msg) + ' <button class="linklike" data-goto="' + view + '">' + esc(linkLabel) + '</button></div>'; }

  // ---------- Dashboard ----------
  function renderDashboard() {
    var orders = activeOrders();
    var doneCount = orders.filter(function (o) { return orderStatus(o).label === "Bajarildi"; }).length;
    var inProgressCount = orders.filter(function (o) { return orderStatus(o).label === "Jarayonda"; }).length;

    var summaryHtml = '<div class="summary-strip">' +
      summaryCell("Farmoyishlar", orders.length, "ta") +
      summaryCell("Bajarilgan", doneCount, "ta") +
      summaryCell("Jarayonda", inProgressCount, "ta") +
      summaryCell("Kirim hujjatlari", state.receipts.length, "ta") +
      '</div>';

    var byMaterial = materialSummary();
    var materialBlock = byMaterial.length ?
      '<table class="ledger"><thead><tr><th>Material turi</th><th class="right">Reja</th><th class="right">Kirim</th><th class="right">Qoldiq</th><th>Bajarilishi</th></tr></thead><tbody>' +
      byMaterial.map(function (m) {
        return '<tr><td>' + esc(m.nomi) + '</td><td class="num right">' + fmtQtyCell(m.reja, m.birlik) + '</td><td class="num right">' + fmtQtyCell(m.kirim, m.birlik) + '</td><td class="num right">' + fmtQtyCell(m.reja - m.kirim, m.birlik) + '</td><td>' + progressCell(m.kirim, m.reja) + '</td></tr>';
      }).join("") + '</tbody></table>'
      : emptyState("Hali material bo'yicha ma'lumot yo'q.", "Birinchi farmoyishni qo'shing", "orders");

    var recent = activeReceipts().slice().sort(function (a, b) { return b.sana.localeCompare(a.sana); }).slice(0, 8);
    var recentBlock = recent.length ?
      '<table class="ledger"><thead><tr><th>Sana</th><th>Farmoyish</th><th>Hujjat</th><th>Materiallar</th></tr></thead><tbody>' +
      recent.map(function (r) {
        var o = getOrderById(r.farmoyishId);
        return '<tr><td class="num">' + fmtDate(r.sana) + '</td><td class="num"><strong>№' + esc(o ? o.raqam : "?") + '</strong></td><td>' + esc(r.hujjat || "—") + '</td><td>' + receiptMaterialsDetail(r) + '</td></tr>';
      }).join("") + '</tbody></table>'
      : emptyState("Hali birorta kirim qayd etilmagan.", "Kirim qo'shish", "receipts");

    return pageHead("Bosh sahifa", "Barcha farmoyishlar bo'yicha demontaj va kirim holatining umumiy ko'rinishi.") +
      summaryHtml +
      block("Material turlari bo'yicha jamlanma", "Barcha farmoyishlardan yig'ilgan reja va kirim", materialBlock) +
      block("So'nggi kirim hujjatlari", "Oxirgi qayd etilgan 8 ta hujjat", recentBlock);
  }

  // ---------- Materials ----------
  function renderMaterials() {
    var formHtml =
      '<div class="card"><form id="materialTypeForm">' +
        '<div class="form-row">' +
          '<div class="field"><label for="mtNomi">Material nomi</label><input id="mtNomi" placeholder="masalan: TPP-10x2" required></div>' +
          '<div class="field"><label for="mtBirlik">O\'lchov birligi</label><select id="mtBirlik">' + unitOptionsHtml("m") + '</select></div>' +
        '</div>' +
        '<div class="form-actions"><button type="submit" class="btn primary">Material qo\'shish</button></div>' +
      '</form></div>';

    var list = state.materialTypes.slice().sort(function (a, b) { return a.nomi.localeCompare(b.nomi); });
    var listHtml = list.length ?
      '<table class="ledger"><thead><tr><th>Material nomi</th><th>Birlik</th><th></th></tr></thead><tbody>' +
      list.map(function (m) { return '<tr><td>' + esc(m.nomi) + '</td><td class="num">' + unitLabel(m.birlik) + '</td><td><button class="btn ghost small icon-btn danger-icon" title="O\'chirish" data-delete-material="' + m.id + '">' + iconTrash() + '</button></td></tr>'; }).join("") + '</tbody></table>'
      : emptyState("Hali birorta material turi qo'shilmagan.", "Yuqoridagi shakl orqali qo'shing", "materials");

    return pageHead("Materiallar", "Farmoyish va kirim shakllarida tanlash uchun material turlari ro'yxati.") +
      block("Yangi material turi qo'shish", "Nomi va o'lchov birligi", formHtml) +
      block("Barcha materiallar", list.length + " ta", listHtml);
  }

  // ---------- Orders (Farmoyishlar) ----------
  function resetOrderForm() {
    state.editingOrderId = null;
    state.orderFormMeta = { raqam: "", sana: todayISO(), izoh: "" };
    state.orderFormRows = [{ nomi: "", miqdor: "" }];
  }

      if (!state.materialTypes.length) {

      } else {
        var meta = state.orderFormMeta;
        formHtml =
          '<div class="card"><form id="orderForm">' +
            '<div class="form-row">' +
              '<div class="field"><label for="orderRaqam">Farmoyish raqami</label><input class="mono" id="orderRaqam" placeholder="masalan: 101" value="' + esc(meta.raqam) + '" required></div>' +
              '<div class="field"><label for="orderSana">Chiqarilgan sana</label><input class="mono" id="orderSana" type="date" value="' + esc(meta.sana || todayISO()) + '" required></div>' +
            '</div>' +
            '<div class="form-row" style="grid-template-columns:1fr;">' +
              '<div class="field"><label for="orderIzoh">Izoh (masalan, hudud)</label><input id="orderIzoh" placeholder="masalan: Chilonzor tumani" value="' + esc(meta.izoh) + '"></div>' +
            '</div>' +
            '<div class="form-row" style="grid-template-columns:1fr;">' +
              '<div class="field"><label for="orderPdf">Tasdiqlovchi hujjat (muhrlangan PDF)</label>' +
                (assetsHandle ?

                  (editing && editing.hujjatFayl ?
                    '<div class="row-hint" style="margin-top:2px;"><a href="/_blob/' + esc(editing.hujjatFayl) + '" target="_blank" rel="noopener">' + iconPdf() + ' Joriy faylni ko\'rish</a> &nbsp; <label style="display:inline-flex;align-items:center;gap:5px;font-weight:400;"><input type="checkbox" id="orderPdfRemove"> olib tashlash</label></div>'
                    : '')
                  : '<div class="row-hint">Fayl biriktirish bu ko\'rinishda mavjud emas (faqat Claude saytida ishlaydi).</div>') +
              '</div>' +
            '</div>' +
            '<div class="field" style="margin-bottom:10px;"><label>Demontaj uchun rejalashtirilgan materiallar</label></div>' +
            '<div class="material-rows" id="materialRows"></div>' +

      }).join("");

  // ---------- Backup ----------
  function storageModeNotice() {
    if (storageMode === "shared") return '<div class="card" style="border-color:color-mix(in srgb, var(--ok) 40%, var(--hairline));"><p style="margin:0;font-size:13.5px;"><strong style="color:var(--ok);">Jamoaviy saqlash faol.</strong> Ma\'lumotlar serverda, real vaqtda ulashiladi.</p></div>';
    if (storageMode === "local") return '<div class="card" style="border-color:color-mix(in srgb, var(--warn) 45%, var(--hairline));"><p style="margin:0;font-size:13.5px;"><strong style="color:var(--warn);">Faqat shu brauzerda saqlanmoqda.</strong> Muntazam zaxira nusxa oling.</p></div>';
    return '<div class="card"><p style="margin:0;font-size:13.5px;color:var(--muted);">Saqlash rejimi aniqlanmoqda...</p></div>';
  }

  function renderBackup() {
    var body = storageModeNotice() +
      '<div class="card"><p style="margin-top:0;color:var(--muted);font-size:13.5px;">Vaqti-vaqti bilan zaxira nusxa yuklab olish tavsiya etiladi.</p>' +
        '<div class="backup-actions">' +
          '<button class="btn primary" id="exportBtn">To\'liq zaxira (.json)</button>' +
          '<button class="btn" id="importBtn">Zaxiradan tiklash</button>' +
          '<input type="file" id="importFile" accept="application/json" style="display:none;">' +
        '</div></div>' +
      '<div class="card"><p style="margin-top:0;color:var(--muted);font-size:13.5px;"><strong style="color:var(--ink);">Excel uchun.</strong> Barcha ma\'lumotlarni Excel (.xlsx) fayl qilib yuklab oling — ichida "Farmoyishlar" va "Kirimlar" nomli ikkita alohida varaq bo\'ladi. Faylni Excel\'da yoki Google Sheets\'da to\'g\'ridan-to\'g\'ri ochish mumkin.</p>' +
        '<div class="backup-actions"><button class="btn" id="exportExcelBtn">Excel (.xlsx) qilib yuklab olish</button></div></div>' +
      '<div class="danger-zone"><h3>Barcha ma\'lumotni o\'chirish</h3><p>Bu amal savatdagilar bilan birga barchasini butunlay o\'chiradi. Oldin zaxira nusxa oling.</p>' +
        '<button class="btn danger-outline" id="wipeBtn">Hammasini o\'chirish</button></div>';
    return pageHead("Zaxira nusxa", "Ma'lumotlaringizni saqlab qo'ying yoki boshqa dasturga ko'chiring.") + body;
  }

  function timestampForFile() {
    var d = new Date();
    var pad = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "_" + pad(d.getHours()) + "-" + pad(d.getMinutes()) + "-" + pad(d.getSeconds());
  }
  function triggerDownload(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function doExport() {
    var payload = { farmoyishlar: state.orders, kirimlar: state.receipts, materialTurlari: state.materialTypes, exportedAt: new Date().toISOString() };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    triggerDownload(blob, "kabel-ombor-zaxira-" + timestampForFile() + ".json");
    showToast("Zaxira nusxa yuklab olindi.");
  }
  function doExportExcel() {
    if (typeof XLSX === "undefined") { showToast("Excel kutubxonasi yuklanmadi. Internetni tekshirib, sahifani yangilang."); return; }

    var orderRows = [["Farmoyish", "Sana", "Izoh", "Material", "Reja", "Birlik", "Kirim", "Qoldiq", "Holat"]];
    activeOrders().slice().sort(function (a, b) { return (a.sana || "").localeCompare(b.sana || ""); }).forEach(function (o) {
      var progress = orderMaterialProgress(o);
      var status = orderStatus(o).label;
      if (!progress.length) {
        orderRows.push(["№" + o.raqam, fmtDate(o.sana), o.izoh || "", "", "", "", "", "", status]);
      } else {
        progress.forEach(function (p) {
          orderRows.push(["№" + o.raqam, fmtDate(o.sana), o.izoh || "", p.nomi, p.reja, unitLabel(p.birlik), p.kirim, p.qoldiq, status]);
        });
      }
    });

    var receiptRows = [["Sana", "Farmoyish", "Hujjat", "Material", "Miqdor", "Birlik"]];
    activeReceipts().slice().sort(function (a, b) { return a.sana.localeCompare(b.sana); }).forEach(function (r) {
      var o = getOrderById(r.farmoyishId);
      (r.materiallar || []).forEach(function (m) { receiptRows.push([fmtDate(r.sana), "№" + (o ? o.raqam : "?"), r.hujjat || "", m.nomi, m.miqdor, unitLabel(m.birlik)]); });
    });

    var wb = XLSX.utils.book_new();
    var wsOrders = XLSX.utils.aoa_to_sheet(orderRows);
    var wsReceipts = XLSX.utils.aoa_to_sheet(receiptRows);
    wsOrders["!cols"] = [{ wch: 10 }, { wch: 12 }, { wch: 20 }, { wch: 18 }, { wch: 10 }, { wch: 8 }, { wch: 10 }, { wch: 10 }, { wch: 14 }];
    wsReceipts["!cols"] = [{ wch: 12 }, { wch: 10 }, { wch: 20 }, { wch: 18 }, { wch: 10 }, { wch: 8 }];
    XLSX.utils.book_append_sheet(wb, wsOrders, "Farmoyishlar");
    XLSX.utils.book_append_sheet(wb, wsReceipts, "Kirimlar");
    XLSX.writeFile(wb, "kabel-ombor-" + timestampForFile() + ".xlsx");
    showToast("Excel fayl yuklab olindi.");
  }
  function doImport(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!Array.isArray(data.farmoyishlar) || !Array.isArray(data.kirimlar)) throw new Error("format");
        importRecords(data);
      } catch (e) { showToast("Fayl formati noto'g'ri. Faqat shu ilovadan eksport qilingan JSON fayl ishlaydi."); }
    };
    reader.readAsText(file);
  }

  // ---------- Events ----------
  function bindNav() {
    document.querySelectorAll("#sidebarNav .navlink, #topbarNav button").forEach(function (btn) { btn.addEventListener("click", function () { setView(btn.dataset.view); }); });
  }

  function bindViewEvents() {
    document.querySelectorAll("[data-goto]").forEach(function (el) { el.addEventListener("click", function () { setView(el.dataset.goto); }); });

    if (state.view === "materials") {
      document.getElementById("materialTypeForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var nomi = document.getElementById("mtNomi").value.trim();
        var birlik = document.getElementById("mtBirlik").value;
        if (!nomi) { showToast("Material nomini kiriting."); return; }
        if (state.materialTypes.some(function (m) { return m.nomi.toLowerCase() === nomi.toLowerCase(); })) { showToast("Bu nomdagi material allaqachon mavjud."); return; }
        addMaterialTypeRecord({ nomi: nomi, birlik: birlik }).then(function () { showToast("Material qo'shildi."); render(); });
      });
      document.querySelectorAll("[data-delete-material]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (!confirm("Ushbu material turini o'chirasizmi? Mavjud farmoyishlardagi yozuvlar o'zgarmaydi.")) return;
          deleteMaterialTypeRecord(btn.dataset.deleteMaterial).then(render);
        });
      });
    }

    if (state.view === "orders") {
      var orderSearchInput = document.getElementById("orderSearch");
      if (orderSearchInput) {
        orderSearchInput.addEventListener("input", function () { state.orderSearch = orderSearchInput.value; render(); });
        if (state.orderSearch) {
          var pos = orderSearchInput.value.length;
          orderSearchInput.focus();
          orderSearchInput.setSelectionRange(pos, pos);
        }
      }
      var toggleBtn = document.getElementById("toggleOrderForm");
      if (toggleBtn) toggleBtn.addEventListener("click", function () {
        if (state.showOrderForm) { state.showOrderForm = false; resetOrderForm(); }
        else { resetOrderForm(); state.showOrderForm = true; }
        render();
      });

      if (state.showOrderForm && state.materialTypes.length) {
        renderMaterialRows();
        document.getElementById("addMaterialRow").addEventListener("click", function () { state.orderFormRows.push({ nomi: "", miqdor: "" }); renderMaterialRows(); });
        document.getElementById("materialRows").addEventListener("input", function (e) {
          var idx = e.target.dataset.rowIndex, field = e.target.dataset.rowField;
          if (idx == null) return;
          state.orderFormRows[idx][field] = e.target.value;
        });
        document.getElementById("materialRows").addEventListener("change", function (e) {
          var idx = e.target.dataset.rowIndex, field = e.target.dataset.rowField;
          if (idx == null) return;
          state.orderFormRows[idx][field] = e.target.value;
        });
        document.getElementById("materialRows").addEventListener("click", function (e) {
          if (e.target.dataset.removeRow == null) return;
          var idx = Number(e.target.dataset.removeRow);
          if (state.orderFormRows.length <= 1) return;
          state.orderFormRows.splice(idx, 1);
          renderMaterialRows();
        });
        var cancelEditBtn = document.getElementById("cancelOrderEdit");
        if (cancelEditBtn) cancelEditBtn.addEventListener("click", function () { state.showOrderForm = false; resetOrderForm(); render(); });

        document.getElementById("orderForm").addEventListener("submit", function (e) {
          e.preventDefault();
          var raqam = document.getElementById("orderRaqam").value.trim();
          var sana = document.getElementById("orderSana").value;
          var izoh = document.getElementById("orderIzoh").value.trim();
          var materiallar = state.orderFormRows
            .filter(function (r) { return r.nomi && Number(r.miqdor) > 0; })
            .map(function (r) { var mt = getMaterialTypeByName(r.nomi); return { id: uid(), nomi: r.nomi, miqdor: Number(r.miqdor), birlik: mt ? mt.birlik : "m" }; });
          if (!raqam || !sana || materiallar.length === 0) { showToast("Farmoyish raqami, sana va kamida bitta material kerak."); return; }

          var editingOrderNow = state.editingOrderId ? getOrderById(state.editingOrderId) : null;
          var pdfInput = document.getElementById("orderPdf");
          var pdfFile = pdfInput && pdfInput.files[0];
          var removeCheckbox = document.getElementById("orderPdfRemove");
          var wantsRemove = removeCheckbox && removeCheckbox.checked;
          var oldAssetId = editingOrderNow ? editingOrderNow.hujjatFayl : null;

          function finalizeSave(hujjatFayl, includeHujjatFayl) {
            var data = { raqam: raqam, sana: sana, izoh: izoh, materiallar: materiallar };
            if (includeHujjatFayl) data.hujjatFayl = hujjatFayl;
            var task = state.editingOrderId ? updateOrderRecord(state.editingOrderId, data) : addOrderRecord(Object.assign({ deleted: false, hujjatFayl: hujjatFayl || null }, data));
            task.then(function () {
              if (oldAssetId && (pdfFile || wantsRemove) && assetsHandle) { assetsHandle.delete(oldAssetId).catch(function () {}); }
              showToast(state.editingOrderId ? "Farmoyish yangilandi." : "Farmoyish №" + raqam + " saqlandi.");
              state.showOrderForm = false;
              resetOrderForm();
              render();
            }).catch(function () { showToast("Saqlashda xatolik yuz berdi."); });
          }

          if (pdfFile && assetsHandle) {
            assetsHandle.upload(pdfFile, { type: "application/pdf" }).then(function (res) {
              finalizeSave(res.id, true);
            }).catch(function () { showToast("PDF yuklashda xatolik yuz berdi. Faylni tekshirib qayta urinib ko'ring."); });
          } else if (wantsRemove) {
            finalizeSave(null, true);
          } else {
            finalizeSave(null, false);
          }
        });
      }

      document.querySelectorAll("[data-quick-receipt]").forEach(function (btn) {
        btn.addEventListener("click", function () { startReceiptForOrder(btn.dataset.quickReceipt); });
      });
      document.querySelectorAll("[data-edit-order]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var o = getOrderById(btn.dataset.editOrder);
          if (!o) return;
          state.editingOrderId = o.id;
          state.orderFormMeta = { raqam: o.raqam, sana: o.sana, izoh: o.izoh || "" };
          state.orderFormRows = (o.materiallar || []).map(function (m) { return { nomi: m.nomi, miqdor: String(m.miqdor) }; });
          if (!state.orderFormRows.length) state.orderFormRows = [{ nomi: "", miqdor: "" }];
          state.showOrderForm = true;
          render();
          window.scrollTo(0, 0);
        });
      });
      document.querySelectorAll("[data-trash-order]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (!confirm("Ushbu farmoyishni savatga tashlaysizmi? Keyinchalik \"Savat\" bo'limidan tiklashingiz mumkin.")) return;
          updateOrderRecord(btn.dataset.trashOrder, { deleted: true }).then(function () { showToast("Farmoyish savatga tashlandi."); render(); });
        });
      });
      document.querySelectorAll("[data-restore-order]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          updateOrderRecord(btn.dataset.restoreOrder, { deleted: false }).then(function () { showToast("Farmoyish tiklandi."); render(); });
        });
      });
      document.querySelectorAll("[data-purge-order]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (!confirm("Ushbu farmoyishni va unga bog'liq barcha kirimlarni butunlay o'chirasizmi? Bu amalni bekor qilib bo'lmaydi.")) return;
          hardDeleteOrderCascade(btn.dataset.purgeOrder).then(function () { showToast("Butunlay o'chirildi."); render(); });
        });
      });
    }

    if (state.view === "receipts") {
      var toggleRc = document.getElementById("toggleReceiptForm");
      if (toggleRc) toggleRc.addEventListener("click", function () {
        if (state.showReceiptForm) { state.showReceiptForm = false; resetReceiptForm(); }
        else { resetReceiptForm(); state.showReceiptForm = true; }
        render();
      });

      if (state.showReceiptForm && activeOrders().length) {
        var orderSel = document.getElementById("rcOrder");
        if (orderSel) orderSel.addEventListener("change", function () {
          state.receiptFormRows = [{ materialNomi: "", miqdor: "" }];
          renderReceiptRows();
        });
        var addRcRow = document.getElementById("addReceiptRow");
        if (addRcRow) addRcRow.addEventListener("click", function () { state.receiptFormRows.push({ materialNomi: "", miqdor: "" }); renderReceiptRows(); });

        var rowsWrap = document.getElementById("receiptRows");
        if (rowsWrap) {
          rowsWrap.addEventListener("input", function (e) {
            var idx = e.target.dataset.rrowIndex, field = e.target.dataset.rrowField;
            if (idx == null) return;
            state.receiptFormRows[idx][field] = e.target.value;
          });
          rowsWrap.addEventListener("change", function (e) {
            var idx = e.target.dataset.rrowIndex, field = e.target.dataset.rrowField;
            if (idx == null) return;
            state.receiptFormRows[idx][field] = e.target.value;
            renderReceiptRows();
          });
          rowsWrap.addEventListener("click", function (e) {
            if (e.target.dataset.removeRrow == null) return;
            var idx = Number(e.target.dataset.removeRrow);
            if (state.receiptFormRows.length <= 1) return;
            state.receiptFormRows.splice(idx, 1);
            renderReceiptRows();
          });
        }

        var cancelRcEdit = document.getElementById("cancelReceiptEdit");
        if (cancelRcEdit) cancelRcEdit.addEventListener("click", function () { state.showReceiptForm = false; resetReceiptForm(); render(); });

        var form = document.getElementById("receiptForm");
        var errBox = document.getElementById("receiptFormError");
        if (form) form.addEventListener("submit", function (e) {
          e.preventDefault();
          errBox.classList.remove("show"); errBox.textContent = "";

          var farmoyishId = document.getElementById("rcOrder").value;
          var order = getOrderById(farmoyishId);
          var sana = document.getElementById("rcSana").value;
          var hujjat = document.getElementById("rcHujjat").value.trim();
          if (!order || !sana) { showToast("Farmoyish va sanani tanlang."); return; }

          var rows = state.receiptFormRows.filter(function (r) { return r.materialNomi && Number(r.miqdor) > 0; });
          if (!rows.length) { showToast("Kamida bitta material va miqdorini kiriting."); return; }

          var progress = orderMaterialProgress(order, state.editingReceiptId);
          var byMaterial = {};
          rows.forEach(function (r) { byMaterial[r.materialNomi] = (byMaterial[r.materialNomi] || 0) + Number(r.miqdor); });
          for (var nomi in byMaterial) {
            var p = progress.find(function (x) { return x.nomi === nomi; });
            var qoldiq = p ? p.qoldiq : 0;
            if (byMaterial[nomi] > qoldiq + 1e-9) {
              errBox.textContent = '"' + nomi + '" uchun faqat ' + fmtQty(qoldiq, p ? p.birlik : "m") + " qoldi, lekin " + fmtQty(byMaterial[nomi], p ? p.birlik : "m") + " kiritilyapti. Miqdorni kamaytiring.";
              errBox.classList.add("show");
              return;
            }
          }

          var materiallar = rows.map(function (r) {
            var mt = progress.find(function (p) { return p.nomi === r.materialNomi; });
            return { nomi: r.materialNomi, miqdor: Number(r.miqdor), birlik: mt ? mt.birlik : "m" };
          });
          var data = { farmoyishId: farmoyishId, sana: sana, hujjat: hujjat, materiallar: materiallar };
          var task = state.editingReceiptId ? updateReceiptRecord(state.editingReceiptId, data) : addReceiptRecord(data);
          task.then(function () {
            showToast(state.editingReceiptId ? "Kirim yangilandi." : "Kirim saqlandi.");
            state.showReceiptForm = false;
            resetReceiptForm();
            render();
          }).catch(function () {
            errBox.textContent = "Saqlashda xatolik yuz berdi. Qayta urinib ko'ring.";
            errBox.classList.add("show");
          });
        });

        renderReceiptRows();
      }

      document.querySelectorAll("[data-edit-receipt]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var r = state.receipts.find(function (x) { return x.id === btn.dataset.editReceipt; });
          if (!r) return;
          var order = getOrderById(r.farmoyishId);
          if (!order || order.deleted) { showToast("Bu kirimning farmoyishi topilmadi yoki savatga tashlangan."); return; }
          state.editingReceiptId = r.id;
          state.receiptFormMeta = { farmoyishId: r.farmoyishId, sana: r.sana, hujjat: r.hujjat || "" };
          state.receiptFormRows = (r.materiallar || []).map(function (m) { return { materialNomi: m.nomi, miqdor: String(m.miqdor) }; });
          if (!state.receiptFormRows.length) state.receiptFormRows = [{ materialNomi: "", miqdor: "" }];
          state.showReceiptForm = true;
          render();
          window.scrollTo(0, 0);
        });
      });

      var fOrder = document.getElementById("filterOrder"), fFrom = document.getElementById("filterFrom"), fTo = document.getElementById("filterTo");
      if (fOrder) fOrder.addEventListener("change", function () { state.receiptFilter.orderId = fOrder.value; render(); });
      if (fFrom) fFrom.addEventListener("change", function () { state.receiptFilter.from = fFrom.value; render(); });
      if (fTo) fTo.addEventListener("change", function () { state.receiptFilter.to = fTo.value; render(); });
      var clearBtn = document.getElementById("clearFilters");
      if (clearBtn) clearBtn.addEventListener("click", function () { state.receiptFilter = { orderId: "", from: "", to: "" }; render(); });

      document.querySelectorAll("[data-trash-receipt]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (!confirm("Ushbu kirim hujjatini savatga tashlaysizmi? Keyinchalik \"Savat\" bo'limidan tiklashingiz mumkin.")) return;
          updateReceiptRecord(btn.dataset.trashReceipt, { deleted: true }).then(function () { showToast("Kirim savatga tashlandi."); render(); });
        });
      });
      document.querySelectorAll("[data-restore-receipt]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          updateReceiptRecord(btn.dataset.restoreReceipt, { deleted: false }).then(function () { showToast("Kirim tiklandi."); render(); });
        });
      });
      document.querySelectorAll("[data-purge-receipt]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (!confirm("Ushbu kirim hujjatini butunlay o'chirasizmi? Bu amalni bekor qilib bo'lmaydi.")) return;
          hardDeleteReceipt(btn.dataset.purgeReceipt).then(function () { showToast("Butunlay o'chirildi."); render(); });
        });
      });
    }

    if (state.view === "backup") {
      document.getElementById("exportBtn").addEventListener("click", doExport);
      document.getElementById("exportExcelBtn").addEventListener("click", doExportExcel);
      var importBtn = document.getElementById("importBtn"), importFile = document.getElementById("importFile");
      importBtn.addEventListener("click", function () { importFile.click(); });
      importFile.addEventListener("change", function () {
        if (importFile.files && importFile.files[0]) {
          if (confirm("Joriy ma'lumotlar tiklangan zaxira bilan almashtiriladi. Davom etasizmi?")) doImport(importFile.files[0]);
        }
      });
      document.getElementById("wipeBtn").addEventListener("click", function () {
        if (confirm("Rostdan ham barcha ma'lumotni o'chirmoqchimisiz? Bu amalni bekor qilib bo'lmaydi.")) wipeAllRecords();
      });
    }
  }

  resetOrderForm();
  resetReceiptForm();
  bindNav();
  render();
  initStorage();
})();
</script>
</body>
</html>
