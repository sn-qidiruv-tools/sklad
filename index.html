<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sklad boshqaruvi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a17;
  --surface:rgba(18,24,46,0.62);
  --surface-solid:#101527;
  --surface-2:rgba(26,33,58,0.7);
  --border:rgba(130,155,255,0.14);
  --border-hi:rgba(130,165,255,0.32);
  --text:#eef1fc;
  --text-dim:#8590b8;
  --blue:#4f8dfd;
  --blue-2:#22d3ee;
  --violet:#8b7bff;
  --grad: linear-gradient(120deg, var(--blue), var(--violet) 60%, var(--blue-2));
  --danger:#fb7185;
  --warn:#fbbf6a;
  --ok:#4fd1a5;
  --radius:18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  position:relative; overflow-x:hidden;
}
h1,h2,.font-display{font-family:'Space Grotesk','Inter',sans-serif}

/* ===== Aurora ambient background (signature element) ===== */
body::before, body::after{
  content:'';position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;
  opacity:.55; animation:drift 16s ease-in-out infinite alternate;
}
body::before{width:520px;height:520px;background:radial-gradient(circle, rgba(79,141,253,.55), transparent 70%);top:-160px;left:-120px}
body::after{width:480px;height:480px;background:radial-gradient(circle, rgba(139,123,255,.45), transparent 70%);bottom:-140px;right:-100px;animation-delay:2s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,20px) scale(1.08)}}
@media (prefers-reduced-motion: reduce){body::before,body::after{animation:none}}

.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(6,10,20,.35);border-top-color:#04101f;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loading-spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--blue);animation:spin .8s linear infinite}
.loading-text{color:var(--text-dim);font-size:13.5px}

.login-screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.login-card{
  width:100%;max-width:380px;background:var(--surface);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border);border-radius:24px;padding:32px 26px;
  box-shadow:0 20px 60px rgba(0,0,10,.45);
}
.login-badge{
  width:44px;height:44px;border-radius:13px;background:var(--grad);display:flex;align-items:center;justify-content:center;
  font-size:20px;margin-bottom:16px;box-shadow:0 8px 22px rgba(79,141,253,.35);
}
.login-title{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.login-sub{color:var(--text-dim);font-size:13px;margin:0 0 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;letter-spacing:.01em}
.field input, .field select{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 13px;
  color:var(--text);font-size:14.5px;font-family:inherit;transition:border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,141,253,.15)}
.btn{
  width:100%;background:var(--grad);color:#06101f;border:none;border-radius:12px;
  padding:13px;font-size:14.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:inherit;transition:transform .12s, box-shadow .12s; box-shadow:0 8px 22px rgba(79,141,253,.25);
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:default}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);box-shadow:none}
.err-msg{color:var(--danger);font-size:12.5px;margin-top:10px;display:none}
.err-msg.show{display:block}

#appScreen{position:relative;z-index:1;display:none;max-width:640px;margin:0 auto;padding:16px 16px 100px}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.app-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.app-title .dot{width:8px;height:8px;border-radius:50%;background:var(--grad)}
.user-chip{
  display:flex;align-items:center;gap:7px;background:var(--surface);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:100px;padding:5px 13px 5px 5px;font-size:12.5px;font-weight:500;
}
.user-avatar{width:23px;height:23px;border-radius:50%;background:var(--grad);color:#06101f;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.icon-btn{
  background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:12px;
  width:37px;height:37px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;
  transition:border-color .15s, color .15s;
}
.icon-btn:hover{border-color:var(--border-hi);color:var(--text)}

.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:16px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:4px;}
.tab-btn{padding:9px 6px;border-radius:11px;border:none;background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;text-align:center;font-family:inherit;transition:.15s}
.tab-btn.active{background:var(--grad);color:#06101f;box-shadow:0 4px 14px rgba(79,141,253,.3)}

.search-box{
  display:flex;align-items:center;gap:8px;background:var(--surface);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:14px;padding:11px 14px;margin-bottom:12px;
}
.search-box input{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;font-family:inherit}
.search-box input:focus{outline:none}
.search-box input::placeholder{color:var(--text-dim)}
.search-icon{color:var(--text-dim);display:flex}
.search-clear{background:none;border:none;color:var(--text-dim);cursor:pointer;display:none;font-size:14px}

.tuman-toggle{display:flex;gap:8px;margin-bottom:12px}
.tuman-btn{
  flex:1;padding:10px 8px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
  backdrop-filter:blur(14px);color:var(--text-dim);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;
}
.tuman-btn.active{border-color:var(--blue);color:#eaf1ff;background:linear-gradient(120deg, rgba(79,141,253,.28), rgba(139,123,255,.22))}

.card{
  position:relative;background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:10px;
  transition:border-color .15s, transform .15s; overflow:hidden;
}
.card:hover{border-color:var(--border-hi)}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(79,141,253,.5), transparent);opacity:0;transition:.2s;
}
.card:hover::before{opacity:1}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.card-seria{font-family:'Space Grotesk',sans-serif;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.card-sub{color:var(--text-dim);font-size:12.5px;margin-top:3px}
.card-tag{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:var(--surface-2);color:var(--blue-2);white-space:nowrap;border:1px solid var(--border)}
.card-actions{display:flex;gap:8px}
.card-btn{flex:1;padding:10px;border-radius:10px;border:none;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .1s}
.card-btn:active{transform:scale(.97)}
.card-btn.primary{background:var(--grad);color:#06101f}
.card-btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.card-btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(251,113,133,.3)}

.empty-msg{color:var(--text-dim);font-size:13px;text-align:center;padding:48px 10px}

.fab{
  position:fixed;bottom:22px;right:50%;transform:translateX(320px);
  background:var(--grad);color:#06101f;border:none;border-radius:100px;
  padding:14px 20px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;font-family:inherit;
  box-shadow:0 10px 28px rgba(79,141,253,.4);cursor:pointer;z-index:20;transition:transform .12s;
}
.fab:active{transform:translateX(320px) scale(.96)}
@media(max-width:680px){.fab{right:16px;transform:none}.fab:active{transform:scale(.96)}}

.overlay{position:fixed;inset:0;background:rgba(4,7,16,.65);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface-solid);border:1px solid var(--border);border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:22px;max-height:88vh;overflow:auto}
@media(min-width:680px){.overlay{align-items:center}.modal{border-radius:22px}}
.modal h2{margin:0 0 18px;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700}
.modal-actions{display:flex;gap:10px;margin-top:18px}

.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:calc(100% - 28px);max-width:420px}
.toast{padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 10px 26px rgba(0,0,10,.4);animation:toastIn .2s ease;backdrop-filter:blur(14px)}
.toast.success{background:rgba(79,141,253,.16);color:#bcd6ff;border:1px solid rgba(79,141,253,.35)}
.toast.error{background:rgba(251,113,133,.14);color:var(--danger);border:1px solid rgba(251,113,133,.32)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Ma'lumotlar yuklanmoqda...</div>
</div>


<div class="login-screen" id="loginScreen" style="display:none">
  <div class="login-card">
    <div class="login-badge">📦</div>
    <div class="login-title">Sklad boshqaruvi</div>
    <p class="login-sub">Davom etish uchun tizimga kiring</p>
    <div class="field"><label>Login</label><input type="text" id="loginInput" autocomplete="off"></div>
    <div class="field"><label>Parol</label><input type="password" id="passInput"></div>
    <button class="btn" id="loginBtn">Kirish</button>
    <div class="err-msg" id="loginError"></div>
  </div>
</div>

<div id="appScreen">
  <div class="top-bar">
    <div class="app-title"><span class="dot"></span> Sklad</div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="icon-btn" id="refreshBtn" title="Yangilash">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      </button>
      <div class="user-chip"><div class="user-avatar" id="userAvatar">?</div><span id="userName">—</span></div>
      <button class="icon-btn" id="logoutBtn" title="Chiqish">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabSklad">📦 Sklad</button>
    <button class="tab-btn" id="tabMening">🧰 Mening olganlarim</button>
    <button class="tab-btn" id="tabTarix">📜 Tarix</button>
  </div>

  <!-- SKLAD paneli -->
  <div id="panelSklad">
    <div class="tuman-toggle" id="skladTumanToggle">
      <button class="tuman-btn active" data-t="all">Barchasi</button>
      <button class="tuman-btn" data-t="buxoro">Buxoro</button>
      <button class="tuman-btn" data-t="kogon">Kogon</button>
    </div>
    <div class="search-box">
      <span class="search-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
      <input type="text" id="skladSearch" placeholder="S/N bo'yicha qidirish...">
      <button class="search-clear" id="skladSearchClear">✕</button>
    </div>
    <div id="skladResults"></div>
  </div>

  <!-- MENING OLGANLARIM paneli -->
  <div id="panelMening" style="display:none">
    <div id="meningResults"></div>
  </div>

  <!-- TARIX paneli -->
  <div id="panelTarix" style="display:none">
    <div class="search-box">
      <span class="search-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
      <input type="text" id="tarixSearch" placeholder="S/N bo'yicha qidirish...">
      <button class="search-clear" id="tarixSearchClear">✕</button>
    </div>
    <div id="tarixResults"></div>
  </div>

  <button class="fab" id="addBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
    Yangi qurilma
  </button>
</div>

<!-- MODAL: Yangi qurilma qo'shish -->
<div class="overlay" id="addOverlay">
  <div class="modal">
    <h2>Skladga yangi qurilma qo'shish</h2>
    <div class="field"><label>S/N (seriya raqami)</label><input type="text" id="newSeria"></div>
    <div class="field"><label>Marka</label><input type="text" id="newMarka"></div>
    <div class="field">
      <label>Tuman</label>
      <select id="newTuman" style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 13px;color:var(--text);font-size:14.5px;font-family:inherit">
        <option value="buxoro">Buxoro</option>
        <option value="kogon">Kogon</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="addCancel">Bekor qilish</button>
      <button class="btn" id="addConfirm">Qo'shish</button>
    </div>
  </div>
</div>

<!-- MODAL: O'rnatildi (manzil so'rash) -->
<div class="overlay" id="installOverlay">
  <div class="modal">
    <h2>Qurilma o'rnatildi</h2>
    <div class="field"><label>O'rnatilgan manzil</label><input type="text" id="installManzil" placeholder="Masalan: Registon ko'chasi 12-uy"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="installCancel">Bekor qilish</button>
      <button class="btn" id="installConfirm">Tasdiqlash</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTjE4zHu_-UL4Lml-RFesU0TAh2HGvV951VM31LGIxk-gGS1ICulC1kJH-DzVr_l1mOg/exec";
const EMPLOYEES_URL = APPS_SCRIPT_URL + "?action=employees";
const SKLAD_URL = APPS_SCRIPT_URL + "?action=sklad";
const KIRIM_URL = APPS_SCRIPT_URL + "?action=kirim";
const CHIQIM_URL = APPS_SCRIPT_URL + "?action=chiqim";

let employees = [];
let sklad = [];
let kirim = [];
let chiqim = [];
let currentUser = null;
let skladTumanFilter = 'all';

function normalize(s){ return (s||'').toString().trim().toLowerCase(); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }

function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'success');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

async function fetchJson(url){
  const resp = await fetch(url, { method:'GET', cache:'no-store' });
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  return await resp.json();
}

async function postAction(payload){
  if(DEMO_MODE){
    // Namoyish rejimida haqiqiy so'rov yubormaymiz — mahalliy massivlarni
    // to'g'ridan-to'g'ri o'zgartirib, xuddi server javob bergandek qilamiz.
    return simulateDemoAction(payload);
  }
  const resp = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  });
  let result;
  try{ result = await resp.json(); }catch(e){ throw new Error('Server javobini o\'qib bo\'lmadi'); }
  if(!result.success) throw new Error(result.error || 'Noma\'lum xatolik');
  return result;
}

function simulateDemoAction(payload){
  const today = new Date().toLocaleDateString('uz-UZ', {day:'2-digit', month:'2-digit', year:'numeric'});
  if(payload.action === 'olish'){
    const idx = sklad.findIndex(d => d['S/N'] === payload.seria);
    if(idx === -1) return Promise.reject(new Error("Qurilma topilmadi"));
    const d = sklad.splice(idx,1)[0];
    kirim.push({ 'S/N':d['S/N'], marka:d.marka, manzil:'', login:payload.login, sana:today, tuman:d.tuman });
  } else if(payload.action === 'ornatish'){
    const idx = kirim.findIndex(d => d['S/N'] === payload.seria);
    if(idx === -1) return Promise.reject(new Error("Qurilma topilmadi"));
    const d = kirim.splice(idx,1)[0];
    chiqim.push({ ...d, manzil: payload.manzil, sana: today });
  } else if(payload.action === 'qaytarish'){
    const idx = kirim.findIndex(d => d['S/N'] === payload.seria);
    if(idx === -1) return Promise.reject(new Error("Qurilma topilmadi"));
    const d = kirim.splice(idx,1)[0];
    sklad.push({ 'S/N':d['S/N'], marka:d.marka, tuman:d.tuman });
  } else if(payload.action === 'yangi_sklad'){
    sklad.push({ 'S/N':payload.seria, marka:payload.marka, tuman:payload.tuman });
  }
  return Promise.resolve({ success:true });
}

async function loadAll(){
  if(DEMO_MODE) return; // Namoyish rejimida qayta yuklash shart emas — mahalliy massivlar allaqachon to'ldirilgan
  try{
    const [s, k, c] = await Promise.all([fetchJson(SKLAD_URL), fetchJson(KIRIM_URL), fetchJson(CHIQIM_URL)]);
    sklad = s || [];
    kirim = k || [];
    chiqim = c || [];
  }catch(err){
    toast("Ma'lumotlarni yuklashda xatolik", 'error');
  }
}

// ============ LOGIN / INIT ============
// === DIZAYN NAMOYISHI REJIMI ===
// Sheets hali ulanmagan (APPS_SCRIPT_URL haligacha PASTE_...). Shu vaqt
// ichida faqat dizaynni ko'rish uchun namunaviy ma'lumot va login'siz
// kirish ishlatiladi. Sheets ulangach (APPS_SCRIPT_URL to'g'irlangach)
// bu qism o'zi e'tiborga olinmaydi va oddiy login oqimi ishga tushadi.
const DEMO_MODE = APPS_SCRIPT_URL.indexOf('PASTE_') === 0;
function loadDemoData(){
  sklad = [
    { 'S/N':'HN4829K01', marka:'Huawei ONU', tuman:'buxoro' },
    { 'S/N':'ZT7710X44', marka:'ZTE F660', tuman:'buxoro' },
    { 'S/N':'HN5591P09', marka:'Huawei ONU', tuman:'kogon' },
    { 'S/N':'GP1123M02', marka:'Splitter 1x8', tuman:'kogon' },
    { 'S/N':'HN4820K77', marka:'Huawei ONU', tuman:'buxoro' },
  ];
  kirim = [
    { 'S/N':'ZT9012Q10', marka:'ZTE F660', manzil:'', login:'demo', sana:'14.08.2026', tuman:'buxoro' },
  ];
  chiqim = [
    { 'S/N':'HN1029A55', marka:'Huawei ONU', manzil:"Registon ko'chasi 12", login:'demo', sana:'12.08.2026', tuman:'buxoro' },
  ];
}

async function initApp(){
  if(DEMO_MODE){
    loadDemoData();
    document.getElementById('loadingScreen').style.display = 'none';
    currentUser = { ism:'Namoyish rejimi', login:'demo', tuman:'buxoro' };
    enterApp();
    return;
  }
  try{
    await Promise.all([
      (async()=>{ try{ employees = await fetchJson(EMPLOYEES_URL); }catch(e){} })(),
      loadAll()
    ]);
  }catch(e){}
  document.getElementById('loadingScreen').style.display = 'none';
  const saved = localStorage.getItem('sklad_user');
  if(saved){
    try{ currentUser = JSON.parse(saved); enterApp(); return; }catch(e){}
  }
  document.getElementById('loginScreen').style.display = 'flex';
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('passInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const loginVal = document.getElementById('loginInput').value.trim();
  const passVal = document.getElementById('passInput').value.trim();
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.classList.remove('show');
  if(!loginVal || !passVal){ errEl.textContent="Login va parolni to'liq kiriting"; errEl.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = 'Tekshirilmoqda...';
  try{
    if(employees.length === 0){ employees = await fetchJson(EMPLOYEES_URL); }
    const found = employees.find(e => normalize(e.LOGIN) === normalize(loginVal) && (e.PAROL||'').toString().trim() === passVal);
    if(found){
      currentUser = { ism: found.ISM, login: found.LOGIN, tuman: (found.tuman||'').toString().trim() };
      localStorage.setItem('sklad_user', JSON.stringify(currentUser));
      enterApp();
    }else{
      errEl.textContent = "Login yoki parol noto'g'ri"; errEl.classList.add('show');
    }
  }catch(err){
    errEl.textContent = "Xatolik yuz berdi, qayta urinib ko'ring"; errEl.classList.add('show');
  }finally{
    btn.disabled = false; btn.textContent = 'Kirish';
  }
}

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  localStorage.removeItem('sklad_user');
  location.reload();
});

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userName').textContent = currentUser.ism;
  document.getElementById('userAvatar').textContent = currentUser.ism.charAt(0).toUpperCase();
  loadAll().then(renderActive);
}

document.getElementById('refreshBtn').addEventListener('click', async ()=>{
  await loadAll();
  renderActive();
  toast("Yangilandi", 'success');
});

// ============ TABS ============
const tabSklad = document.getElementById('tabSklad');
const tabMening = document.getElementById('tabMening');
const tabTarix = document.getElementById('tabTarix');
const panelSklad = document.getElementById('panelSklad');
const panelMening = document.getElementById('panelMening');
const panelTarix = document.getElementById('panelTarix');

function renderActive(){
  if(tabSklad.classList.contains('active')) renderSklad();
  else if(tabMening.classList.contains('active')) renderMening();
  else renderTarix();
}

function showTab(tab, panel){
  [tabSklad, tabMening, tabTarix].forEach(t=>t.classList.remove('active'));
  [panelSklad, panelMening, panelTarix].forEach(p=>p.style.display='none');
  tab.classList.add('active'); panel.style.display='block';
  document.getElementById('addBtn').style.display = (panel===panelSklad) ? 'flex' : 'none';
}
tabSklad.addEventListener('click', ()=>{ showTab(tabSklad, panelSklad); renderSklad(); });
tabMening.addEventListener('click', ()=>{ showTab(tabMening, panelMening); renderMening(); });
tabTarix.addEventListener('click', ()=>{ showTab(tabTarix, panelTarix); renderTarix(); });

// ============ SKLAD TAB ============
document.querySelectorAll('#skladTumanToggle .tuman-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#skladTumanToggle .tuman-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    skladTumanFilter = btn.dataset.t;
    renderSklad();
  });
});

const skladSearch = document.getElementById('skladSearch');
const skladSearchClear = document.getElementById('skladSearchClear');
skladSearch.addEventListener('input', ()=>{
  skladSearchClear.style.display = skladSearch.value ? 'flex' : 'none';
  renderSklad();
});
skladSearchClear.addEventListener('click', ()=>{ skladSearch.value=''; skladSearchClear.style.display='none'; renderSklad(); });

function renderSklad(){
  const q = normalize(skladSearch.value.trim());
  let list = sklad.slice();
  if(skladTumanFilter !== 'all') list = list.filter(d => normalize(d.tuman) === skladTumanFilter);
  if(q.length >= 2) list = list.filter(d => normalize(d['S/N']).includes(q));
  const el = document.getElementById('skladResults');
  if(list.length === 0){
    el.innerHTML = `<div class="empty-msg">${q ? "Hech narsa topilmadi" : "Skladda qurilma yo'q"}</div>`;
    return;
  }
  el.innerHTML = list.slice(0,150).map(d => `
    <div class="card">
      <div class="card-top">
        <div><div class="card-seria">${escapeHtml(d['S/N']||'')}</div><div class="card-sub">${escapeHtml(d.marka||'')}</div></div>
        <div class="card-tag">${d.tuman==='buxoro'?'Buxoro':d.tuman==='kogon'?'Kogon':escapeHtml(d.tuman||'')}</div>
      </div>
      <div class="card-actions">
        <button class="card-btn primary" onclick="oldim('${encodeURIComponent(d['S/N'])}')">✅ Oldim</button>
      </div>
    </div>`).join('');
}

async function oldim(seriaEnc){
  const seria = decodeURIComponent(seriaEnc);
  try{
    await postAction({ action:'olish', seria, login: currentUser.login });
    toast("Qurilma sizga biriktirildi", 'success');
    await loadAll();
    renderActive();
  }catch(err){
    toast(err.message, 'error');
  }
}
window.oldim = oldim;

// ============ MENING OLGANLARIM TAB ============
function renderMening(){
  const list = kirim.filter(d => normalize(d.login) === normalize(currentUser.login));
  const el = document.getElementById('meningResults');
  if(list.length === 0){
    el.innerHTML = `<div class="empty-msg">Siz hali hech qanday qurilma olmagansiz</div>`;
    return;
  }
  el.innerHTML = list.slice(0,150).map(d => `
    <div class="card">
      <div class="card-top">
        <div><div class="card-seria">${escapeHtml(d['S/N']||'')}</div><div class="card-sub">${escapeHtml(d.marka||'')} · Olingan: ${escapeHtml(d.sana||'')}</div></div>
        <div class="card-tag">${d.tuman==='buxoro'?'Buxoro':d.tuman==='kogon'?'Kogon':escapeHtml(d.tuman||'')}</div>
      </div>
      <div class="card-actions">
        <button class="card-btn primary" onclick="openInstall('${encodeURIComponent(d['S/N'])}')">🔧 O'rnatildi</button>
        <button class="card-btn danger" onclick="qaytarish('${encodeURIComponent(d['S/N'])}')">↩ Qaytarish</button>
      </div>
    </div>`).join('');
}

let installSeria = null;
const installOverlay = document.getElementById('installOverlay');
function openInstall(seriaEnc){
  installSeria = decodeURIComponent(seriaEnc);
  document.getElementById('installManzil').value = '';
  installOverlay.classList.add('show');
}
window.openInstall = openInstall;
document.getElementById('installCancel').addEventListener('click', ()=> installOverlay.classList.remove('show'));
installOverlay.addEventListener('click', e=>{ if(e.target===installOverlay) installOverlay.classList.remove('show'); });

document.getElementById('installConfirm').addEventListener('click', async ()=>{
  const manzil = document.getElementById('installManzil').value.trim();
  if(!manzil){ toast("Manzilni kiriting", 'error'); return; }
  const seria = installSeria;
  installOverlay.classList.remove('show');
  try{
    await postAction({ action:'ornatish', seria, login: currentUser.login, manzil });
    toast("Qurilma o'rnatildi deb belgilandi", 'success');
    await loadAll();
    renderActive();
  }catch(err){
    toast(err.message, 'error');
  }
});

async function qaytarish(seriaEnc){
  const seria = decodeURIComponent(seriaEnc);
  try{
    await postAction({ action:'qaytarish', seria, login: currentUser.login });
    toast("Qurilma omborga qaytarildi", 'success');
    await loadAll();
    renderActive();
  }catch(err){
    toast(err.message, 'error');
  }
}
window.qaytarish = qaytarish;

// ============ TARIX TAB (Chiqim — o'rnatilganlar) ============
const tarixSearch = document.getElementById('tarixSearch');
const tarixSearchClear = document.getElementById('tarixSearchClear');
tarixSearch.addEventListener('input', ()=>{
  tarixSearchClear.style.display = tarixSearch.value ? 'flex' : 'none';
  renderTarix();
});
tarixSearchClear.addEventListener('click', ()=>{ tarixSearch.value=''; tarixSearchClear.style.display='none'; renderTarix(); });

function renderTarix(){
  const q = normalize(tarixSearch.value.trim());
  let list = chiqim.slice().reverse();
  if(q.length >= 2) list = list.filter(d => normalize(d['S/N']).includes(q));
  const el = document.getElementById('tarixResults');
  if(list.length === 0){
    el.innerHTML = `<div class="empty-msg">${q ? "Topilmadi" : "Hali hech narsa o'rnatilmagan"}</div>`;
    return;
  }
  el.innerHTML = list.slice(0,150).map(d => `
    <div class="card">
      <div class="card-top">
        <div><div class="card-seria">${escapeHtml(d['S/N']||'')}</div><div class="card-sub">${escapeHtml(d.marka||'')} · ${escapeHtml(d.manzil||'')}</div></div>
        <div class="card-tag">${d.tuman==='buxoro'?'Buxoro':d.tuman==='kogon'?'Kogon':escapeHtml(d.tuman||'')}</div>
      </div>
      <div class="card-sub">O'rnatdi: ${escapeHtml(d.login||'')} · ${escapeHtml(d.sana||'')}</div>
    </div>`).join('');
}

// ============ YANGI QURILMA QO'SHISH ============
const addOverlay = document.getElementById('addOverlay');
document.getElementById('addBtn').addEventListener('click', ()=>{
  document.getElementById('newSeria').value = '';
  document.getElementById('newMarka').value = '';
  addOverlay.classList.add('show');
});
document.getElementById('addCancel').addEventListener('click', ()=> addOverlay.classList.remove('show'));
addOverlay.addEventListener('click', e=>{ if(e.target===addOverlay) addOverlay.classList.remove('show'); });

document.getElementById('addConfirm').addEventListener('click', async ()=>{
  const seria = document.getElementById('newSeria').value.trim();
  const marka = document.getElementById('newMarka').value.trim();
  const tuman = document.getElementById('newTuman').value;
  if(!seria){ toast("Seriya raqamini kiriting", 'error'); return; }
  addOverlay.classList.remove('show');
  try{
    await postAction({ action:'yangi_sklad', seria, marka, tuman });
    toast("Qurilma skladga qo'shildi", 'success');
    await loadAll();
    renderActive();
  }catch(err){
    toast(err.message, 'error');
  }
});

initApp();
</script>
